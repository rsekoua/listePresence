# Nginx — Gestion de Présence (production)
# À adapter : server_name, chemins, puis : sudo ln -s vers /etc/nginx/sites-enabled/
#
# Notes :
# - Le frontend React (build Vite) est servi en statique.
# - L'API Django tourne derrière Gunicorn sur 127.0.0.1:8000.
# - Les photos CNI ne sont PAS exposées via /media (accès privé) : elles sont
#   servies uniquement par l'API authentifiée (/api/.../photo/...). Ne pas
#   ajouter de location /media/ publique.

server {
    listen 80;
    server_name domaine.com;

    # Taille max des uploads (photos CNI ~ quelques Mo)
    client_max_body_size 10M;

    # --- Frontend (SPA React) ---
    root /var/www/presence/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API Django (Gunicorn) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin Django ---
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Fichiers statiques Django (admin, DRF/Ninja docs) ---
    location /static/ {
        alias /var/www/presence/backend/staticfiles/;
        access_log off;
        expires 30d;
    }
}

# HTTPS : laisser Certbot (sudo certbot --nginx -d domaine.com) ajouter le
# bloc listen 443 + la redirection 80 -> 443.

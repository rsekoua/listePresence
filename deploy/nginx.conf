# Nginx — Gestion de Présence (production, mono-origine)
#
# NON UTILISÉ tel quel sur ce VPS : CloudPanel génère et gère son propre vhost
# Nginx (site type "Reverse Proxy" → 127.0.0.1:8000) ainsi que le certificat
# Let's Encrypt (onglet SSL/TLS du site). Ce fichier reste comme référence /
# fallback si l'app est un jour déployée sans CloudPanel (Nginx brut + Certbot).
#
# Notes :
# - Déploiement mono-origine : Gunicorn (Django + WhiteNoise) sert TOUT — API,
#   admin, statiques Django ET le build React (cf. backend/config/settings.py,
#   FRONTEND_DIST/WHITENOISE_ROOT). Nginx n'est qu'un reverse proxy + terminaison TLS.
# - Les photos CNI ne sont PAS exposées via /media (accès privé) : elles sont
#   servies uniquement par l'API authentifiée (/api/.../photo/...). Ne pas
#   ajouter de location /media/ publique.

server {
    listen 80;
    server_name liste.rsekoua.org;

    # Taille max des uploads (photos CNI ~ quelques Mo)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS : laisser Certbot (sudo certbot --nginx -d liste.rsekoua.org)
# ajouter le bloc listen 443 + la redirection 80 -> 443.

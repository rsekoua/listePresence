# ═══════════════════════════════════════════════════════════════════════════
#  Nginx — Gestion de Présence  (liste.rsekoua.org)
#
#  Installation :
#    sudo cp deploy/nginx-security-headers.conf \
#            /etc/nginx/snippets/presence-security-headers.conf
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/liste.rsekoua.org
#    sudo ln -s /etc/nginx/sites-available/liste.rsekoua.org /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════
#
# Architecture : Nginx termine le TLS, sert les fichiers statiques directement
# depuis le disque, et relaie le reste à Gunicorn par une socket Unix.
#
# Django/WhiteNoise sait servir le build React, mais chaque fichier y occupe
# alors un worker Python. Les `location` statiques ci-dessous court-circuitent
# l'application : les 3 workers Gunicorn restent disponibles pour l'API.
#
# ⚠️  Le dossier `backend/media/` (photos de CNI) n'est JAMAIS servi par Nginx.
#     Ces images ne sortent que par l'API authentifiée
#     (/api/activites/…/photo/…). Ne jamais ajouter de `location /media/`.

# --- Zones de limitation de débit -------------------------------------------
# Contexte `http` : sur Debian/Ubuntu, sites-enabled/* est inclus dans le bloc
# `http` de /etc/nginx/nginx.conf, ces directives sont donc au bon niveau ici.
#
# Elles complètent — sans les remplacer — les compteurs applicatifs
# (apps/throttle.py), qui sont plus fins (par compte, par activité) mais qui
# coûtent un worker Python et une requête SQL par tentative. Nginx arrête le
# gros du flot avant qu'il n'atteigne Django.
limit_req_zone  $binary_remote_addr zone=presence_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=presence_form:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=presence_api:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=presence_conn:10m;

# --- Politiques de sécurité du contenu (CSP) --------------------------------
# Déclarées en `map` pour être écrites une seule fois puis référencées par
# variable : `add_header` ajoute (il ne remplace pas), il ne doit donc y avoir
# qu'UN SEUL `Content-Security-Policy` par `location`.
#
# CSP de l'application : verrou anti-XSS, et seul rempart qui limite les dégâts
# si un script hostile s'exécute — les JWT vivent dans le localStorage, donc
# lisibles par tout script de la page (cf. deploy/README.md § Sécurité).
#  - 'unsafe-inline' sur style-src : requis par Mantine/Emotion, qui injecte ses
#    styles à l'exécution ; n'autorise aucune exécution de code.
#  - blob: sur img-src : browser-image-compression prévisualise via un blob.
#  - frame-ancestors 'none' : anti-clickjacking (double le X-Frame-Options).
#  - form-action 'self' : un formulaire injecté ne peut pas poster ailleurs.
map "" $presence_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests";
}

# CSP de l'admin Django, qui émet des styles et des scripts en ligne. Plus
# souple, et cantonnée à ce seul chemin.
map "" $presence_csp_admin {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'";
}

upstream presence_app {
    server unix:/run/presence.sock fail_timeout=0;
    keepalive 16;
}

# ─────────────────────── HTTP : redirection vers HTTPS ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name liste.rsekoua.org;

    # Seule exception à la redirection : le renouvellement Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────── HTTPS : le site ───────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name liste.rsekoua.org;

    # ═══ TLS ═══════════════════════════════════════════════════════════════
    # Certificat posé par :
    #   sudo certbot certonly --webroot -w /var/www/certbot -d liste.rsekoua.org
    ssl_certificate     /etc/letsencrypt/live/liste.rsekoua.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liste.rsekoua.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Suites AEAD à échange éphémère uniquement (ni CBC, ni RSA statique) :
    # confidentialité persistante — un trafic capturé aujourd'hui reste
    # illisible même si la clé privée du serveur fuite demain.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # laisser le mobile préférer ChaCha20
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    ssl_session_cache shared:PresenceTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;   # les tickets affaiblissent la confidentialité persistante

    # Pas d'`ssl_stapling` : Let's Encrypt a cessé de servir des réponses OCSP
    # (2025). L'activer ne ferait qu'ajouter une latence et des avertissements
    # dans le journal — la révocation passe désormais par les CRL du navigateur.

    # ═══ En-têtes de sécurité ══════════════════════════════════════════════
    # Un `include` explicite dans CHAQUE bloc qui pose ses propres en-têtes :
    # un `location` contenant un seul `add_header` perd tous ceux du parent.
    include snippets/presence-security-headers.conf;
    add_header Content-Security-Policy $presence_csp always;

    # ═══ Journalisation ════════════════════════════════════════════════════
    access_log /var/log/nginx/liste.rsekoua.org.access.log;
    error_log  /var/log/nginx/liste.rsekoua.org.error.log warn;

    # ═══ Bornes du corps de requête et délais ══════════════════════════════
    # 1 Mo par défaut : seules les routes qui reçoivent des photos de CNI
    # relèvent cette limite, et uniquement elles.
    client_max_body_size  1m;
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          60s;
    limit_conn presence_conn 24;   # anti-slowloris / anti-monopolisation

    # ═══ Compression ═══════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/manifest+json font/ttf font/otf;
    # Sert les .gz pré-calculés par collectstatic/WhiteNoise quand ils existent
    # (compression faite une fois au déploiement, pas à chaque requête).
    gzip_static on;

    root /var/www/liste/backend/frontend_dist;
    index index.html;

    # ═══ Statiques : servis par Nginx, sans passer par Python ══════════════

    # Build Vite : noms de fichiers hachés → contenu immuable, cache maximal.
    location /assets/ {
        include snippets/presence-security-headers.conf;
        add_header Content-Security-Policy $presence_csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Statiques Django (admin), produits par collectstatic (noms hachés aussi).
    location /static/ {
        alias /var/www/liste/backend/staticfiles/;
        include snippets/presence-security-headers.conf;
        add_header Content-Security-Policy $presence_csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include snippets/presence-security-headers.conf;
        add_header Content-Security-Policy $presence_csp always;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location = /icons.svg {
        include snippets/presence-security-headers.conf;
        add_header Content-Security-Policy $presence_csp always;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # Application privée : rien ne doit être indexé.
    location = /robots.txt {
        default_type text/plain;
        access_log off;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ═══ Refus explicites ══════════════════════════════════════════════════

    # Photos de CNI : jamais servies depuis le disque, uniquement via l'API.
    location ^~ /media/ { return 404; }

    # Fichiers de configuration et sauvegardes que les scanners réclament en
    # boucle. 404 plutôt que 403 : ne rien confirmer sur ce qui existe.
    location ~ /\.(?!well-known) { access_log off; return 404; }
    location ~* \.(env|ini|sqlite3?|log|bak|sql|py|pyc|toml|lock|service|socket)$ {
        access_log off;
        return 404;
    }

    # ═══ Application ═══════════════════════════════════════════════════════
    #
    # Les directives `proxy_*` sont répétées dans chaque `location` : Nginx n'a
    # pas d'héritage sélectif utilisable ici, et les factoriser dans un snippet
    # rendrait plus difficile de voir quelle route a quelle limite.

    # Connexion : la route la plus attaquée du site.
    location = /api/auth/login {
        limit_req zone=presence_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # Formulaire public (non authentifié) : reçoit deux photos de CNI.
    location ^~ /api/public/ {
        limit_req zone=presence_form burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 25m;    # 2 photos + marge
        client_body_timeout 120s;    # tolérance aux connexions mobiles lentes

        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        # Le corps complet est reçu par Nginx AVANT d'atteindre Django : un
        # client mobile lent n'immobilise pas un des 3 workers Gunicorn.
        proxy_request_buffering on;
        proxy_redirect off;
    }

    # Reste de l'API : tableau de bord, exports, photos de CNI.
    location ^~ /api/ {
        limit_req zone=presence_api burst=40 nodelay;
        limit_req_status 429;

        client_max_body_size 25m;    # ajout/édition d'un participant avec photos

        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;     # gros exports ZIP/PDF

        # Bufferisation ACTIVE et généreuse : un export ZIP de plusieurs Mo est
        # absorbé par Nginx puis servi au rythme du client. Sans cela, un
        # navigateur lent garderait un worker Gunicorn sur trois occupé pendant
        # tout le téléchargement.
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 256m;
        proxy_redirect off;
    }

    # Admin Django — surface d'attaque maximale (connexion par session, sans la
    # limitation applicative qui protège /api/auth/login).
    #
    # ⚠️  Le chemin DOIT correspondre à DJANGO_ADMIN_URL dans backend/.env.
    # ⚠️  Renseignez l'allowlist d'IP ci-dessous : c'est de loin la protection
    #     la plus efficace. Si vous n'avez pas d'IP fixe, préférez couper
    #     l'admin (DJANGO_ADMIN_URL= dans le .env) et tout administrer depuis
    #     l'interface React, qui elle est limitée en débit.
    location ^~ /gestion-interne/ {
        # allow 203.0.113.10;      # ← votre IP fixe
        # allow 10.8.0.0/24;       # ← sous-réseau VPN
        # deny all;

        limit_req zone=presence_auth burst=5 nodelay;
        limit_req_status 429;

        include snippets/presence-security-headers.conf;
        # CSP assouplie, posée ICI et nulle part ailleurs pour cette zone : le
        # snippet n'en contient aucune, la réponse n'en porte donc qu'une.
        add_header Content-Security-Policy $presence_csp_admin always;

        proxy_pass http://presence_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
    }

    # SPA React : le fichier s'il existe, sinon index.html (routes virtuelles
    # /dashboard, /form/:token…). Aucun appel à Python.
    location / {
        include snippets/presence-security-headers.conf;
        add_header Content-Security-Policy $presence_csp always;
        # index.html référence les fichiers hachés du build : une version en
        # cache survivrait à un déploiement et casserait le site.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

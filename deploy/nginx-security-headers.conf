# En-têtes de sécurité communs — Gestion de Présence
# → /etc/nginx/snippets/presence-security-headers.conf
#
# ⚠️  POURQUOI UN FICHIER SÉPARÉ PLUTÔT QUE DES `add_header` AU NIVEAU `server` :
#     dans Nginx, dès qu'un `location` déclare UN SEUL `add_header`, il perd
#     TOUS ceux hérités du bloc parent. Un vhost qui pose ses en-têtes de
#     sécurité au niveau `server` puis ajoute un simple `Cache-Control` dans un
#     `location` sert donc silencieusement ce `location` sans HSTS, sans CSP et
#     sans Referrer-Policy. D'où ce fichier, `include`é explicitement dans
#     chaque bloc qui pose des en-têtes.
#
# ⚠️  LA CSP N'EST PAS ICI : `add_header` AJOUTE un en-tête, il ne remplace pas
#     celui déjà posé. Deux `Content-Security-Policy` dans une même réponse
#     sont appliquées par intersection — la plus stricte gagne — et l'admin
#     Django, qui a besoin d'une CSP plus souple, se retrouverait cassé sans
#     message d'erreur clair. La CSP est donc posée une seule fois par
#     `location`, via $presence_csp / $presence_csp_admin (cf. nginx.conf).
#
# `always` : sans lui, l'en-tête disparaît des réponses 4xx/5xx — précisément
# celles qu'un attaquant cherche à provoquer.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "same-origin" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Coupe l'accès aux capteurs que l'application n'utilise pas. `camera=(self)`
# est conservé : le formulaire public photographie les CNI depuis le mobile.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Application privée : rien ne doit être indexé.
add_header X-Robots-Tag "noindex, nofollow" always;

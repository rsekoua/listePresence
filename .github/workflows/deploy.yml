name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principe du moindre privilège : par défaut, GITHUB_TOKEN reçoit des droits
# d'écriture sur le dépôt selon la configuration de l'organisation. Aucun job
# ici n'écrit quoi que ce soit — on ne garde que la lecture du code.
permissions:
  contents: read

# Deux pushes rapprochés ne doivent pas déployer en parallèle sur le même VPS.
# `cancel-in-progress: false` : on laisse un déploiement engagé aller au bout
# (migrations en cours) plutôt que de l'interrompre à mi-chemin.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # pas de token git laissé sur le disque du runner

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tests backend
        working-directory: backend
        env:
          # Sans ça, DEBUG=False par défaut et Django refuse de démarrer
          # (garde-fou anti-clé-de-dev-en-prod, cf. settings.py).
          DJANGO_DEBUG: "True"
        run: |
          uv sync
          uv run python manage.py test

      - name: Contrôles de sécurité Django (mode production)
        working-directory: backend
        env:
          # Rejoue la configuration RÉELLE de production : un durcissement
          # oublié (cookie non-Secure, HSTS absent, DEBUG resté à True) fait
          # échouer la CI ici, et non en découverte sur le serveur.
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-secret-de-test-uniquement-suffisamment-long-pour-passer-le-controle
          JWT_SECRET: ci-jwt-secret-de-test-distinct-de-la-secret-key
          DJANGO_ALLOWED_HOSTS: liste.rsekoua.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://liste.rsekoua.org
        run: uv run python manage.py check --deploy --fail-level WARNING

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Lint + tests + build frontend
        working-directory: frontend-v2
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Audit des dépendances npm
        working-directory: frontend-v2
        # Informatif : une vulnérabilité publiée dans une dépendance ne doit pas
        # bloquer un correctif urgent, mais doit être visible dans le journal.
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    name: Déploiement
    needs: test
    # Ni sur une pull request, ni sur une branche autre que main : sans cette
    # garde, un workflow_dispatch depuis une branche quelconque déploierait son
    # code en production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environnement GitHub : permet d'exiger une approbation manuelle et de
    # restreindre les secrets à ce seul job (Settings → Environments).
    environment:
      name: production
      url: https://liste.rsekoua.org
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # ⚠️ SANS `fingerprint`, l'action accepte N'IMPORTE QUELLE clé d'hôte :
          # un attaquant capable de détourner la résolution DNS ou le routage
          # récupérerait la clé privée de déploiement au premier push. Relever
          # l'empreinte sur le VPS :
          #   ssh-keyscan -t ed25519 -p 22 liste.rsekoua.org | ssh-keygen -lf - -E sha256
          # puis la stocker dans le secret SSH_HOST_FINGERPRINT
          # (format attendu : SHA256:xxxxxxxx…).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 15m
          script_stop: true
          script: bash /var/www/liste.rsekoua.org/deploy/deploy.sh

      - name: Vérification publique
        # Contrôle de bout en bout : DNS + TLS + Nginx + Gunicorn + Django.
        # Le health-check interne de deploy.sh ne teste que la socket Unix ; un
        # vhost Nginx cassé ou un certificat expiré ne s'y verrait pas.
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            if curl -fsS --max-time 10 https://liste.rsekoua.org/api/health | grep -q '"ok"'; then
              echo "✅ https://liste.rsekoua.org/api/health répond"
              exit 0
            fi
            echo "tentative $i/6…"; sleep 5
          done
          echo "❌ Le site ne répond pas publiquement après le déploiement." >&2
          exit 1
